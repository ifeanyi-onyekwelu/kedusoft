version: "3.9"

services:
  # Flask backend
  server:
    build: ./server # folder with your Flask Dockerfile
    ports:
      - "5000:5000" # maps local port 5000 to container
    env_file:
      - ./server/.env # your local env variables
    depends_on:
      - db # wait for DB to start first

  # Postgres database
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # React + Vite frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173" # Vite default dev server port
    env_file:
      - ./client/.env
    depends_on:
      - server

volumes:
  pgdata: # persists Postgres data
