name: Flask and React CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  flask-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # Use your local python version

      - name: Install Flask Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Flask Tests
        run: pytest

  react-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install NPM packages
        run: npm install

      - name: Build Check
        run: npm run build
