<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @page { size: A4; margin: 0; }
        body {
            font-family: 'Inter', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            background-color: #f8fafc; /* Subtle grey background */
        }
        .container { padding: 40px; background-color: #ffffff; min-height: 100%; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #290665;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .logo { height: 45px; }
        .doc-title { color: #290665; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin: 0; }

        .footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 9px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Badge Styles */
        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .received { background: #dbeafe; color: #1e40af; }
        .rejected { background: #fee2e2; color: #991b1b; }
        .accepted { background: #dcfce7; color: #166534; }
        .under_review { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="https://res.cloudinary.com/dhzujlkls/image/upload/v1766829730/logo_frx51w.png" class="logo">
        <h2 class="doc-title">{% block title %}{% endblock %}</h2>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        PROPERTY OWNER CONFIDENTIAL • GENERATED BY LETSTEN LTD • {{ now.strftime('%Y-%m-%d') }}
    </div>
</div>
</body>
</html>
