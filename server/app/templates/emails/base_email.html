<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kedusoft{% endblock %}</title>
  <style>
    /* RESET STYLES */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .wrapper {
      width: 100%;
      background-color: #f9fafb;
      padding: 40px 0;
    }

    .main-content {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
    }

    /* HEADER */
    .header {
      padding: 40px 40px 20px;
    }

    .logo-img {
      height: 40px;
      width: auto;
      display: block;
    }

    /* BODY */
    .body-text {
      padding: 0 40px 40px;
      line-height: 1.6;
    }

    .body-text h2 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-top: 0;
      letter-spacing: -0.02em;
    }

    .body-text p {
      font-size: 15px;
      color: #4b5563;
    }

    /* SUMMARY BOX */
    .highlight-box {
      background-color: #fcfcfd;
      border: 1px solid #f3f4f6;
      border-left: 3px solid #CF8205;
      padding: 24px;
      margin: 30px 0;
    }

    .summary-label {
      font-size: 12px;
      font-weight: 700;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 15px;
      font-weight: 600;
      color: #111827;
      margin: 0;
    }

    /* BUTTON */
    .btn-container {
      margin-top: 30px;
    }

    .btn {
      background-color: #290665;
      color: #ffffff !important;
      padding: 14px 32px;
      text-decoration: none;
      font-weight: 600;
      border-radius: 4px;
      display: inline-block;
      font-size: 14px;
    }

    .btn:hover {
      background-color: #1a0442;
    }

    /* FOOTER */
    .footer {
      max-width: 600px;
      margin: 0 auto;
      padding: 30px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }

    .footer a {
      color: #9ca3af;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    hr {
      border: 0;
      border-top: 1px solid #f3f4f6;
      margin: 35px 0 25px;
    }

    /* MOBILE OPTIMIZATION */
    @media (max-width: 600px) {

      .header,
      .body-text {
        padding-left: 20px;
        padding-right: 20px;
      }

      .main-content {
        border: none;
      }
    }

      {
      % block extra_styles %
    }

      {
      % endblock %
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="main-content">
      <div class="header">
        <img src="https://res.cloudinary.com/dhzujlkls/image/upload/v1766829730/logo_frx51w.png" alt="Kedusoft"
          class="logo-img">
      </div>

      <div class="body-text">
        {% block content %}{% endblock %}

        <hr>
        <p style="font-size: 13px; color: #9ca3af;">
          Best regards,<br>
          <strong style="color: #4b5563;">The Kedusoft Team</strong>
        </p>
      </div>
    </div>

    <div class="footer">
      <p>&copy; 2025 Kedusoft Technologies. All rights reserved.</p>
      <p>Lagos, Nigeria | <a href="https://kedusoft.com/privacy">Privacy Policy</a></p>
    </div>
  </div>
</body>

</html>
